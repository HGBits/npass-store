[package]
name = "npass-passkeyd"
version = "1.0.0"
edition = "2024"
rust-version = "1.91"
description = "Autenticador FIDO2/WebAuthn virtual (CTAP2 + UHID) cujo único armazenamento é o npass"
license = "GPL-3.0-or-later"
publish = false

[[bin]]
name = "npass-passkeyd"
path = "src/main.rs"

[lib]
name = "npass_passkeyd"
path = "src/lib.rs"

[dependencies]
# Só o necessário: sem a feature "usb" (hidapi/libudev) — o transporte aqui é UHID.
soft-fido2 = { version = "=0.17.0", default-features = false, features = ["std"] }
soft-fido2-ctap = { version = "=0.17.0", default-features = false, features = ["std"] }
soft-fido2-transport = { version = "=0.17.0", default-features = false }
base64 = "0.22"
libc = "0.2"

[dev-dependencies]
p256 = { version = "0.14", features = ["ecdsa"] }
sha2 = "0.11"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true
panic = "abort"
